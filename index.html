<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Profile Card</title>
    <!-- Nhúng phông chữ viết và font code chuyên dụng -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="card-container">
        <!-- Đốm sáng trang trí phía sau card -->
        <div class="glow-bg"></div>

        <div class="profile-card">

            <!-- NÚT LIGHT/DARK MODE -->
            <button id="theme-toggle" class="theme-btn">
                <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path
                        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
                    </path>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                </svg>
            </button>

            <!-- GIAO DIỆN CHÍNH (THÔNG TIN PROFILE) -->
            <div id="main-profile-content">
                <div class="card-header">
                    <div class="avatar-wrapper">
                        <img src="ava.png" alt="User Avatar" class="avatar">
                        <span class="status-badge"></span>
                    </div>
                    <h2>Lê Hữu Phi</h2>
                    <p class="job-title">Website Developer</p>
                </div>
                <!-- THÔNG TIN LIÊN HỆ -->
                <div class="card-body">
                    <!-- Điện thoại -->
                    <a href="tel:+84387614187" class="info-link">
                        <div class="info-icon"><img src="dien-thoai.png" alt="Phone" class="social-logo"></div>
                        <div class="info-text"><span class="label">Điện thoại</span>
                            <span class="value">+84 387 614 187</span>
                        </div>
                    </a>

                    <!-- Email -->
                    <a href="#" class="info-link">
                        <div class="info-icon"><img src="mail.png" alt="Mail" class="social-logo"></div>
                        <div class="info-text"><span class="label">Email liên hệ</span>
                            <span class="value">lp5378411@gmail.com</span>
                        </div>
                    </a>
<!-- target="_blank" -->
                    <!-- Trường học -->
                    <a href="https://cdktcnqn.edu.vn" target="_blank" class="info-link">
                        <div class="info-icon"><img src="truong-cd.png" alt="School" class="social-logo"></div>
                        <div class="info-text"><span class="label">School</span>
                            <span class="value">Quy Nhon College of Technology</span>
                        </div>
                    </a>

                    <!-- BẤM VÀO ĐÂY ĐỂ XEM SOURCE CODE TRỰC TIẾP TRÊN CARD -->
                    <a href="#" id="view-source-trigger" class="info-link">
                        <div class="info-icon"><img src="folder.jpg" alt="Coffee" class="social-logo"></div>
                        <div class="info-text"><span class="label">Website Source</span>
                            <span class="value">Xem dự án trực tiếp tại đây</span>
                        </div>
                    </a>
                </div>
                <!-- Liên kết mạng xã hội dạng icon tròn vector -->
                <div class="social-icons-container">
                    <!-- Facebook -->
                    <a href="https://www.facebook.com/wei.077" target="_blank" class="social-icon-btn"
                        data-tooltip="Facebook">
                        <svg class="social-icon" viewBox="0 0 24 24">
                            <path fill="currentColor"
                                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                        </svg>
                    </a>

                    <!-- Zalo (Đã sửa lỗi hiển thị) -->
                    <a href="https://zalo.me/0387614187" target="_blank" class="social-icon-btn" data-tooltip="Zalo">
                        <!-- <svg class="social-icon" viewBox="0 0 24 24">
                            <path fill="currentColor"
                                d="M9.5 10h13c.83 0 1.5.67 1.5 1.5v1c0 .83-.67 1.5-1.5 1.5h-7.38l7.15 9.77c.45.62 0 1.23-.77 1.23h-13c-.83 0-1.5-.67-1.5-1.5v-1c0-.83.67-1.5 1.5-1.5h7.38l-7.15-9.77c-.45-.62 0-1.23.77-1.23z" />
                        </svg> -->
                        <svg class="social-icon" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path fill="currentColor"
                                d="M12.49 10.2722v-.4496h1.3467v6.3218h-.7704a.576.576 0 01-.5763-.5729l-.0006.0005a3.273 3.273 0 01-1.9372.6321c-1.8138 0-3.2844-1.4697-3.2844-3.2823 0-1.8125 1.4706-3.2822 3.2844-3.2822a3.273 3.273 0 011.9372.6321l.0006.0005zM6.9188 7.7896v.205c0 .3823-.051.6944-.2995 1.0605l-.03.0343c-.0542.0615-.1815.206-.2421.2843L2.024 14.8h4.8948v.7682a.5764.5764 0 01-.5767.5761H0v-.3622c0-.4436.1102-.6414.2495-.8476L4.8582 9.23H.1922V7.7896h6.7266zm8.5513 8.3548a.4805.4805 0 01-.4803-.4798v-7.875h1.4416v8.3548H15.47zM20.6934 9.6C22.52 9.6 24 11.0807 24 12.9044c0 1.8252-1.4801 3.306-3.3066 3.306-1.8264 0-3.3066-1.4808-3.3066-3.306 0-1.8237 1.4802-3.3044 3.3066-3.3044zm-10.1412 5.253c1.0675 0 1.9324-.8645 1.9324-1.9312 0-1.065-.865-1.9295-1.9324-1.9295s-1.9324.8644-1.9324 1.9295c0 1.0667.865 1.9312 1.9324 1.9312zm10.1412-.0033c1.0737 0 1.945-.8707 1.945-1.9453 0-1.073-.8713-1.9436-1.945-1.9436-1.0753 0-1.945.8706-1.945 1.9436 0 1.0746.8697 1.9453 1.945 1.9453z" />
                        </svg>
                    </a>

                    <!-- Github -->
                    <a href="https://github.com/wei7-dev" target="_blank" class="social-icon-btn" data-tooltip="Github">
                        <svg class="social-icon" viewBox="0 0 24 24">
                            <path fill="currentColor"
                                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                        </svg>
                    </a>
                </div>
            </div>

            <!-- GIAO DIỆN HIỂN THỊ DANH SÁCH DỰ ÁN CUỘN TRONG LÒNG CARD -->
            <div id="code-viewer-content" style="display: none;">
                <div class="viewer-header">
                    <button id="back-to-profile" class="control-btn-back">Quay lại</button>
                </div>

                <!-- VÙNG KHUNG CHỨA DANH SÁCH NHIỀU DỰ ÁN (Có tích hợp thanh cuộn mượt) -->
                <div class="code-box-wrapper projects-list-scroll-wrapper">
                    <div id="projects-container-list" class="projects-vertical-stack">
                        <!-- JavaScript sẽ tự động render hàng loạt thanh dự án xếp tầng vào đây -->
                    </div>
                </div>

                <!-- THANH ĐIỀU HƯỚNG DÙNG ĐỂ CHUYỂN TRANG/DANH MỤC KHI SỐ LƯỢNG DỰ ÁN QUÁ LỚN -->
                <div class="viewer-footer">
                    <button id="prev-project" class="nav-btn">◀ Trước</button>
                    <span id="project-counter">Trang 1 / 1</span>
                    <button id="next-project" class="nav-btn">Sau ▶</button>
                </div>
            </div>


        </div>
    </div>

    <!-- Kết nối file JavaScript -->
    <script src="index.js"></script>
</body>

</html>
